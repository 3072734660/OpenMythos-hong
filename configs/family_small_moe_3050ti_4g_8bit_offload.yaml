model_family:
  family_name: public_moe_code_trace
  size: small_moe_1b_active_3050ti_4g_8bit_offload
  role: local_cuda_train_low_vram_fallback
  architecture_style: public_sparse_moe_causal_lm
  prompt_style: code_stdout_exact
  train_jsonl: data/train.jsonl
  eval_jsonl: data/eval.jsonl
  supports_multiturn: true
public_pretrained_moe:
  backend: hf_transformers
  model_id: allenai/OLMoE-1B-7B-0125
  local_model_path: ${OLMOE_1B_7B_DIR:-models/OLMoE-1B-7B-0125}
  local_files_only: true
  trust_remote_code: false
  require_true_moe: true
  dtype: float16
  device: cuda
  device_map: auto
  quantize: 8bit_bnb
  load_in_8bit_fp32_cpu_offload: true
  max_memory:
    0: 3000MiB
    cpu: 64GiB
  offload_folder: offload/olmoe_1b_7b_3050ti_4g_8bit
  offload_state_dict: true
  low_cpu_mem_usage: true
  response_cache_size: 64
  use_chat_template: false
  gradient_checkpointing: true
  lora_r: 4
  lora_alpha: 8
  lora_dropout: 0.05
  optim: paged_adamw_8bit
  enable_prefix_cache: true
  prefix_cache_size: 16
  prefix_cache_min_tokens: 1
training:
  method: qlora_8bit_cpu_offload
  max_steps: 1000
  micro_batch_size: 1
  learning_rate: 0.0001
  max_length: 192
  expected_gpu: RTX 3050 Ti Laptop 4GB
  response_only_labels: true
  gradient_accumulation_steps: 32
  max_grad_norm: 0.3
  save_steps: 50
  eval_steps: 25
  save_total_limit: 2
serving:
  max_new_tokens: 96
  temperature: 0.0
  top_k: 1
