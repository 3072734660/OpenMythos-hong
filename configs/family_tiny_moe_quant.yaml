model_family:
  family_name: public_moe_code_trace
  size: tiny
  role: debug_train_process
  architecture_style: sparse_moe_causal_lm
  prompt_style: code_stdout_exact
  train_jsonl: data/train.jsonl
  eval_jsonl: data/eval.jsonl
  supports_multiturn: true
public_pretrained_moe:
  backend: tiny_true_moe
  model_id: tiny-true-moe-code-trace-quantized
  local_files_only: true
  require_true_moe: true
  dtype: float32
  device: cpu
  quantize: int8_dynamic
  response_cache_size: 64
  enable_prefix_cache: true
  prefix_cache_size: 16
  prefix_cache_min_tokens: 1
training:
  seed: 2026
  steps: 40
  learning_rate: 0.01
  max_seq_len: 896
  dim: 32
  n_layers: 2
  n_heads: 4
  n_experts: 4
  top_k: 2
  expert_hidden_dim: 64
